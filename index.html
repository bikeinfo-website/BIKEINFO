<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BIKEINFO</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
        opacity: 0;
        transition: opacity 0.5s ease;
    }

    body.loaded {
        opacity: 1;
    }
</style>

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            🏍️ BIKEINFO
        </a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#bikeNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="bikeNavbar">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="bikes.html">Bikes</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#" data-bs-toggle="dropdown">
                        Categories
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="bikes.html">All Bikes</a></li>
                        <li><a class="dropdown-item" href="gallery.html">Gallery</a></li>
                    </ul>
                </li>

            </ul>

            <form class="d-flex me-2">
                <input class="form-control me-2"
                       type="search" placeholder="Search bikes">
                <button class="btn btn-outline-light"
                        type="submit">Search</button>
            </form>

            <a href="registration.html"
               class="btn btn-success">Sign Up</a>

        </div>
    </div>
</nav>

    <div class="container mt-5">
        <h1 class="text-center text-primary">
            Welcome to BIKEINFO
        </h1>

        <p class="text-center">
            Explore Bikes, Details and Comparisons.
        </p>

        <button class="btn btn-success">
            Explore Bikes
        </button>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div class="container mt-5 mb-5">
    <h2 class="text-center">Bike Enquiry Form</h2>

    <form>
        <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-control"
                   placeholder="Enter your name">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control"
                   placeholder="Enter your email">
        </div>

        <div class="mb-3">
            <label class="form-label">Select Bike</label>
            <select class="form-select">
                <option>Hero Splendor Plus</option>
                <option>Honda Shine</option>
                <option>TVS Raider</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Submit Enquiry
        </button>
    </form>
    <div class="nav-item dropdown">
    <a class="nav-link dropdown-toggle" href="#"
       role="button" data-bs-toggle="dropdown">
        Bike Categories
    </a>

    <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="bikes.html">All Bikes</a></li>
        <li><a class="dropdown-item" href="timetable.html">Bike Comparison</a></li>
        <li><a class="dropdown-item" href="gallery.html">Bike Gallery</a></li>
    </ul>
</div>
</div>
<div class="container mt-5 mb-5">
    <h2 class="text-center">Explore Bikes</h2>

    <div class="btn-toolbar justify-content-center mt-4"
         role="toolbar">

        <div class="btn-group me-2" role="group">
            <button class="btn btn-primary">All Bikes</button>
            <button class="btn btn-primary">Sports</button>
            <button class="btn btn-primary">Commuter</button>
        </div>

        <div class="btn-group" role="group">
            <button class="btn btn-success">Compare</button>
            <button class="btn btn-success">Gallery</button>
        </div>

    </div>
</div>
<div class="container mt-5 mb-5">
    <h2 class="text-center">Search Your Bike</h2>

    <div class="input-group mt-4">
        <span class="input-group-text">Bike Name</span>
        <input type="text" class="form-control"
               placeholder="Enter bike name">
        <button class="btn btn-primary">Search</button>
    </div>

    <div class="input-group mt-3">
        <span class="input-group-text">₹</span>
        <input type="number" class="form-control"
               placeholder="Enter budget">
        <span class="input-group-text">INR</span>
    </div>
</div>
<script>
    window.addEventListener("load", function() {
        document.body.classList.add("loaded");
    });

    document.querySelectorAll("a").forEach(function(link) {
        link.addEventListener("click", function(event) {
            let url = link.getAttribute("href");

            if (url && url.endsWith(".html")) {
                event.preventDefault();

                document.body.style.opacity = "0";

                setTimeout(function() {
                    window.location.href = url;
                }, 500);
            }
        });
    });
</script>
</body>
</html>
